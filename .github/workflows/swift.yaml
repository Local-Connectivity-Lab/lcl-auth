name: Swift CI

on: [push, pull_request]

jobs:
  build:
    name: Swift 5.9.2 on Ubuntu 22.04
    runs-on: ubuntu-latest

    container:
      image: swift:5.9.2-jammy

    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test